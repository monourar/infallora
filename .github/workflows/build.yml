name: Release Infallora

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install --no-save @tauri-apps/cli

      - name: Download yt-dlp
        shell: pwsh
        run: curl.exe -L --retry 3 -o yt-dlp.exe https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe

      - name: Download ffmpeg
        shell: pwsh
        run: |
          curl.exe -L --retry 3 -o ffmpeg.zip https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path ffmpeg.zip))
          $bins = $z.Entries | Where-Object { $_.FullName -match '/bin/(ffmpeg|ffprobe)\.exe$' }
          foreach ($e in $bins) {
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($e, (Join-Path (Get-Location) $e.Name), $true)
          }
          $z.Dispose()

      - name: Build signed installer + latest.json
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Generate latest.json
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $sigPath = "src-tauri/target/release/bundle/nsis/Infallora_${version}_x64-setup.exe.sig"
          $signature = (Get-Content $sigPath -Raw).Trim()
          $url = "https://github.com/monourar/infallora/releases/download/v${version}/Infallora_${version}_x64-setup.exe"
          $payload = @{
            version  = $version
            notes    = "Infallora $version"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url       = $url
              }
            }
          } | ConvertTo-Json -Depth 6
          $payload | Set-Content "src-tauri/target/release/bundle/latest.json" -Encoding UTF8
          Get-Content "src-tauri/target/release/bundle/latest.json"

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem -Recurse src-tauri/target/release/bundle | Select-Object FullName, Length

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/latest.json
